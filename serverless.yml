org: ximenagamero
service: api-web-scraping-sismos

provider:
  name: aws
  runtime: python3.12
  # Default memory size for functions (default: 1024MB)
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::764683083428:role/LabRole

functions:
  scrape_sismos:
    handler: scrap_sismos.lambda_handler # El nombre del archivo y la funcion deben coincidir
    package:
      include:
        - ./** # Incluir todo el contenido del directorio (incluye las librerias instaladas)
    events:
      - http:
          path: /scrape/sismos
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
